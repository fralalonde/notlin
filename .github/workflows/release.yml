name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # e.g. "v0.2.0" — jobs strip the leading 'v' for artifact names.
  VERSION: ${{ github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # JDK 25 baseline (see check.yml); lombok does not support javac 27.
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - run: cargo fmt --all --check
      - run: cargo clippy --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: tools/e2e.sh "$JAVA_HOME/bin/javac"

  # notlin is a single-crate CLI with no platform-specific syscalls beyond the
  # Rust stdlib: cross-platform release binaries come from a plain
  # cross-compile matrix, no packaging scripts (no deb/rpm/msi — install is a
  # single static binary, or cargo install from the tag).
  assets:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # aarch64-linux-gnu cross-linker for the gnu arm target
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          ver="${VERSION#v}"
          mkdir dist
          cp "target/${{ matrix.target }}/release/notlin${{ matrix.ext || '' }}" \
             "dist/notlin-$ver-${{ matrix.target }}${{ matrix.ext || '' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  # scripts/ installers are attached verbatim so the documented
  # releases/latest/download/install.sh|ps1 one-liners resolve.
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: release-installers
          path: |
            scripts/install.sh
            scripts/install.ps1

  release:
    needs: [test, assets, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
