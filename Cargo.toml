[package]
name = "notlin"
version = "0.1.2"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
colored = "3"
tree-sitter = "0.25"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-java = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
cap-std = "4"

[dev-dependencies]
filetime = "0.2"
